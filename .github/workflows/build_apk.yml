name: Build Smart Dairy Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --verbose > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::--- BUILD FAILURE LOG START ---"
            grep -E "FAILURE|Error:|exception|Execution failed" build.log -B 2 -A 5 | tail -n 40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            tail -n 30 build.log | while IFS= read -r line; do
              echo "::warning::${line}"
            done
            exit $STATUS
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartDairy-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Smart Dairy v1.0.0 - Android APK"
          body: "Official Release APK for Smart Dairy Application"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
